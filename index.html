<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CS 2.5D - contra.cc.cd</title>
    <style>
        /* ---------- ГЛОБАЛЬНЫЕ СТИЛИ ---------- */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #0a0a0f;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: none; /* скрыто до выбора устройства */
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
        }

        /* ---------- МЕНЮ ВЫБОРА УСТРОЙСТВА ---------- */
        #device-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at center, #1a1a2e, #0a0a0f);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #device-menu h1 {
            color: #ffa502;
            font-size: 4rem;
            font-weight: 900;
            text-shadow: 0 0 40px rgba(255,165,0,0.3);
            margin-bottom: 0.2rem;
            letter-spacing: 4px;
        }
        #device-menu .sub {
            color: #888;
            font-size: 1.2rem;
            letter-spacing: 6px;
            margin-bottom: 2.5rem;
        }
        .device-buttons {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .device-btn {
            padding: 1.5rem 3.5rem;
            font-size: 2rem;
            font-weight: bold;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s;
            background: #2d3436;
            color: #fff;
            box-shadow: 0 8px 0 #1a1a2e;
            min-width: 200px;
        }
        .device-btn:hover { transform: translateY(-4px); box-shadow: 0 12px 0 #1a1a2e; }
        .device-btn.pc { background: #0984e3; }
        .device-btn.pc:hover { background: #0873c7; }
        .device-btn.phone { background: #6c5ce7; }
        .device-btn.phone:hover { background: #5a4bd1; }

        /* ---------- HUD (интерфейс) ---------- */
        #hud {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 2rem;
            background: rgba(0,0,0,0.7);
            padding: 10px 30px;
            border-radius: 12px;
            border: 1px solid rgba(255,165,0,0.3);
            color: #fff;
            font-weight: bold;
            font-size: 1.1rem;
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
            backdrop-filter: blur(6px);
        }
        #hud .hp { color: #ff4757; }
        #hud .ammo { color: #ffa502; }
        #hud .kills { color: #2ed573; }
        #hud .weapon { color: #a29bfe; margin-left: 10px; }

        /* ---------- МАГАЗИН (модальное окно) ---------- */
        #shop-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 500;
        }
        #shop-window {
            background: #1e1e2f;
            border: 2px solid #ffa502;
            border-radius: 24px;
            padding: 2.5rem 3rem;
            max-width: 500px;
            width: 90%;
            color: #fff;
            box-shadow: 0 0 60px rgba(255,165,0,0.2);
            position: relative;
        }
        #shop-window h2 {
            color: #ffa502;
            font-size: 2rem;
            text-align: center;
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
        }
        #shop-window .weapon-info {
            text-align: center;
            font-size: 1.2rem;
            margin: 1rem 0;
            background: #2d3436;
            padding: 12px;
            border-radius: 12px;
        }
        #shop-window .weapon-info span { color: #ffa502; font-weight: bold; }
        #shop-window input[type="range"] {
            width: 100%;
            margin: 1rem 0;
            accent-color: #ffa502;
            height: 8px;
            border-radius: 4px;
            background: #2d3436;
        }
        #shop-window .range-labels {
            display: flex;
            justify-content: space-between;
            color: #aaa;
            font-size: 0.9rem;
            margin-top: -0.5rem;
        }
        #shop-close-btn {
            display: block;
            margin: 1.5rem auto 0;
            padding: 12px 40px;
            background: #ffa502;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #000;
            cursor: pointer;
            transition: 0.3s;
        }
        #shop-close-btn:hover { background: #ffbe2e; transform: scale(1.03); }

        /* ---------- ЭЛЕМЕНТЫ УПРАВЛЕНИЯ ДЛЯ ТЕЛЕФОНА ---------- */
        #touch-controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            height: 40%;
            pointer-events: none;
            z-index: 20;
            display: none; /* показываем только в телефонном режиме */
        }
        #joystick-area {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 140px;
            height: 140px;
            pointer-events: auto;
            touch-action: none;
        }
        #joystick-base {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.3);
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        #joystick-thumb {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffa502, #d35400);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px rgba(255,165,0,0.4);
            pointer-events: none;
        }
        #action-buttons {
            position: absolute;
            bottom: 40px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: none;
            align-items: flex-end;
        }
        .touch-btn {
            pointer-events: auto;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(4px);
            border: 2px solid rgba(255,255,255,0.3);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            transition: 0.1s;
            touch-action: manipulation;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .touch-btn:active { transform: scale(0.92); background: rgba(255,255,255,0.3); }
        .touch-btn.fire {
            width: 90px;
            height: 90px;
            background: rgba(255,50,50,0.3);
            border-color: #ff4757;
            font-size: 2.2rem;
        }
        .touch-btn.reload { background: rgba(255,165,0,0.2); border-color: #ffa502; }
        .touch-btn.shop-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: rgba(255,165,0,0.2);
            border-color: #ffa502;
            font-size: 1.6rem;
            pointer-events: auto;
        }

        /* ---------- ЭКРАН СМЕРТИ ---------- */
        #death-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 600;
            flex-direction: column;
            color: #fff;
        }
        #death-screen h1 {
            font-size: 4rem;
            color: #ff4757;
            text-shadow: 0 0 60px rgba(255,50,50,0.3);
        }
        #death-screen .stats {
            font-size: 1.8rem;
            margin: 1rem 0 2rem;
            color: #aaa;
        }
        #death-screen .stats span { color: #ffa502; font-weight: bold; }
        #death-screen button {
            padding: 16px 48px;
            font-size: 1.5rem;
            border: none;
            border-radius: 12px;
            background: #ffa502;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        #death-screen button:hover { background: #ffbe2e; transform: scale(1.05); }

        /* ---------- АДАПТИВ ---------- */
        @media (max-width: 768px) {
            #hud { font-size: 0.9rem; padding: 6px 16px; gap: 1rem; }
            .device-btn { padding: 1rem 2rem; font-size: 1.5rem; min-width: 140px; }
            #device-menu h1 { font-size: 2.8rem; }
            #shop-window { padding: 1.5rem; }
            #joystick-area { width: 110px; height: 110px; left: 10px; bottom: 10px; }
            #joystick-base { width: 100px; height: 100px; }
            #joystick-thumb { width: 48px; height: 48px; }
            .touch-btn { width: 60px; height: 60px; font-size: 1.4rem; }
            .touch-btn.fire { width: 75px; height: 75px; font-size: 1.8rem; }
            #action-buttons { right: 15px; bottom: 20px; gap: 12px; }
        }
        @media (max-width: 480px) {
            #hud { font-size: 0.7rem; padding: 4px 12px; gap: 0.6rem; }
            .device-btn { padding: 0.8rem 1.2rem; font-size: 1.2rem; min-width: 100px; }
            #device-menu h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <!-- МЕНЮ ВЫБОРА УСТРОЙСТВА -->
    <div id="device-menu">
        <h1>☢️ CS 2.5D</h1>
        <div class="sub">DE_DUST2</div>
        <div class="device-buttons">
            <button class="device-btn pc" onclick="selectDevice('pc')">💻 ПК</button>
            <button class="device-btn phone" onclick="selectDevice('phone')">📱 Телефон</button>
        </div>
    </div>

    <!-- ИГРОВОЙ КОНТЕЙНЕР -->
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- HUD -->
        <div id="hud">
            <span class="hp">❤️ <span id="hpDisplay">100</span></span>
            <span class="ammo">🔫 <span id="ammoDisplay">30</span></span>
            <span class="kills">💀 <span id="killsDisplay">0</span></span>
            <span class="weapon" id="weaponDisplay">🔫 Пистолет</span>
        </div>

        <!-- МАГАЗИН -->
        <div id="shop-overlay">
            <div id="shop-window">
                <h2>🏪 МАГАЗИН</h2>
                <div class="weapon-info" id="weaponInfo">
                    <span id="weaponName">Пистолет</span> &nbsp;|&nbsp; Урон: <span id="weaponDamage">20</span> &nbsp;|&nbsp; Патроны: <span id="weaponMagSize">12</span>
                </div>
                <input type="range" id="weaponSlider" min="0" max="2" value="0" step="1">
                <div class="range-labels">
                    <span>🔫 Пистолет</span>
                    <span>🔫 Автомат</span>
                    <span>🎯 Снайпер</span>
                </div>
                <button id="shop-close-btn" onclick="closeShop()">✅ Принять</button>
            </div>
        </div>

        <!-- ЭКРАН СМЕРТИ -->
        <div id="death-screen">
            <h1>💀 ТЫ ПОГИБ</h1>
            <div class="stats">Убийств: <span id="deathKills">0</span></div>
            <button onclick="restartGame()">🔄 Играть снова</button>
        </div>

        <!-- ЭЛЕМЕНТЫ УПРАВЛЕНИЯ ДЛЯ ТЕЛЕФОНА -->
        <div id="touch-controls">
            <div id="joystick-area">
                <div id="joystick-base">
                    <div id="joystick-thumb"></div>
                </div>
            </div>
            <div id="action-buttons">
                <button class="touch-btn reload" id="reloadBtn">🔄</button>
                <button class="touch-btn fire" id="fireBtn">🔥</button>
            </div>
            <button class="touch-btn shop-btn" id="shopTouchBtn">🛒</button>
        </div>
    </div>

    <!-- ПОДКЛЮЧАЕМ THREE.JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // ============================================================
        //  ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
        // ============================================================
        let device = 'pc'; // 'pc' или 'phone'
        let scene, camera, renderer;
        let player = {
            mesh: null,
            x: 0, z: 0,
            angle: 0,
            hp: 100,
            maxHp: 100,
            ammo: 30,
            maxAmmo: 30,
            kills: 0,
            reloading: false,
            reloadTimer: 0,
            shootCooldown: 0,
            weapon: 0, // 0=пистолет, 1=автомат, 2=снайпер
            weaponData: [
                { name: 'Пистолет', damage: 20, magSize: 12, reloadTime: 40, fireRate: 15, range: 20 },
                { name: 'Автомат', damage: 15, magSize: 30, reloadTime: 60, fireRate: 8, range: 25 },
                { name: 'Снайпер', damage: 50, magSize: 5, reloadTime: 80, fireRate: 30, range: 40 }
            ]
        };
        let bots = [];
        let bullets = [];
        let walls = [];
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let mouse = { x: 0, y: 0, down: false };
        let touch = { active: false, startX: 0, startY: 0, endX: 0, endY: 0 };
        let joystickActive = false;
        let gameRunning = true;
        let clock = new THREE.Clock();

        // ============================================================
        //  ВЫБОР УСТРОЙСТВА
        // ============================================================
        function selectDevice(type) {
            device = type;
            document.getElementById('device-menu').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';

            if (device === 'phone') {
                // Поворот экрана в ландшафт
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(() => {});
                }
                document.getElementById('touch-controls').style.display = 'block';
                // Сделаем HUD чуть меньше
                document.getElementById('hud').style.fontSize = '0.9rem';
            } else {
                document.getElementById('touch-controls').style.display = 'none';
            }

            initGame();
        }

        // ============================================================
        //  ИНИЦИАЛИЗАЦИЯ ИГРЫ
        // ============================================================
        function initGame() {
            const canvas = document.getElementById('gameCanvas');
            const container = document.getElementById('game-container');

            // СЦЕНА
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            scene.fog = new THREE.Fog(0x1a1a2e, 40, 60);

            // КАМЕРА (изометрическая)
            const aspect = container.clientWidth / container.clientHeight;
            camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 100);
            camera.position.set(25, 20, 25);
            camera.lookAt(0, 0, 0);

            // РЕНДЕРЕР
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // ОСВЕЩЕНИЕ
            const ambient = new THREE.AmbientLight(0x404060, 0.6);
            scene.add(ambient);
            const dirLight = new THREE.DirectionalLight(0xffeedd, 1);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            const d = 30;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            dirLight.shadow.camera.near = 1;
            dirLight.shadow.camera.far = 40;
            scene.add(dirLight);

            // КАРТА (пол)
            const groundGeo = new THREE.PlaneGeometry(40, 40);
            const groundMat = new THREE.MeshStandardMaterial({
                color: 0xc2a87d,
                roughness: 0.8,
                metalness: 0.1
            });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // СТЕНЫ (по краям)
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x6d4c2a, roughness: 0.7 });
            const wallPositions = [
                [-20, 0, 0, 0.5, 2, 40],
                [20, 0, 0, 0.5, 2, 40],
                [0, 0, -20, 40, 2, 0.5],
                [0, 0, 20, 40, 2, 0.5]
            ];
            wallPositions.forEach(([x, y, z, w, h, d]) => {
                const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
                wall.position.set(x, y, z);
                wall.castShadow = true;
                wall.receiveShadow = true;
                scene.add(wall);
                walls.push(wall);
            });

            // УКРЫТИЯ (ящики)
            const boxMat = new THREE.MeshStandardMaterial({ color: 0x8B7355, roughness: 0.6 });
            const boxPositions = [
                [-8, 0.5, -6, 3, 1, 3],
                [6, 0.5, -8, 4, 1, 2],
                [-5, 0.5, 7, 2, 1, 4],
                [8, 0.5, 5, 3, 1, 3],
                [0, 0.5, -2, 4, 1, 1],
                [-10, 0.5, -12, 2, 1, 2],
                [12, 0.5, -10, 2, 1, 2],
                [10, 0.5, 12, 3, 1, 2],
                [-12, 0.5, 10, 2, 1, 2]
            ];
            boxPositions.forEach(([x, y, z, w, h, d]) => {
                const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), boxMat);
                box.position.set(x, y, z);
                box.castShadow = true;
                box.receiveShadow = true;
                scene.add(box);
                walls.push(box);
            });

            // СОЗДАНИЕ ИГРОКА
            createPlayer();

            // СОЗДАНИЕ БОТОВ
            createBots();

            // УПРАВЛЕНИЕ
            setupControls();

            // АНИМАЦИОННЫЙ ЦИКЛ
            animate();
        }

        // ============================================================
        //  ИГРОК
        // ============================================================
        function createPlayer() {
            if (player.mesh) {
                scene.remove(player.mesh);
            }
            const group = new THREE.Group();

            // Тело
            const bodyGeo = new THREE.CylinderGeometry(0.8, 0.8, 1.8, 8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3498db, roughness: 0.3 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.9;
            body.castShadow = true;
            group.add(body);

            // Направление (конус для прицела)
            const coneGeo = new THREE.ConeGeometry(0.4, 0.8, 6);
            const coneMat = new THREE.MeshStandardMaterial({ color: 0xffa502 });
            const cone = new THREE.Mesh(coneGeo, coneMat);
            cone.position.set(0, 0.9, 1.2);
            cone.rotation.x = Math.PI / 2;
            group.add(cone);

            // Индикатор HP (над головой)
            const hpBar = new THREE.Mesh(
                new THREE.PlaneGeometry(1.6, 0.2),
                new THREE.MeshBasicMaterial({ color: 0x2ed573, transparent: true })
            );
            hpBar.position.y = 2.2;
            hpBar.name = 'hpBar';
            group.add(hpBar);

            group.position.set(0, 0, 0);
            scene.add(group);
            player.mesh = group;
            player.x = 0;
            player.z = 0;
            player.angle = 0;
        }

        function updatePlayerHPBar() {
            const bar = player.mesh.getObjectByName('hpBar');
            if (bar) {
                const ratio = Math.max(0, player.hp / player.maxHp);
                bar.material.color.setHex(ratio > 0.5 ? 0x2ed573 : (ratio > 0.25 ? 0xffa502 : 0xff4757));
                bar.scale.x = ratio;
            }
        }

        // ============================================================
        //  БОТЫ
        // ============================================================
        function createBots() {
            bots = [];
            const botMat = new THREE.MeshStandardMaterial({ color: 0xe74c3c, roughness: 0.4 });
            for (let i = 0; i < 5; i++) {
                const group = new THREE.Group();
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 1.6, 6), botMat);
                body.position.y = 0.8;
                body.castShadow = true;
                group.add(body);
                // Индикатор HP
                const hpBar = new THREE.Mesh(
                    new THREE.PlaneGeometry(1.4, 0.15),
                    new THREE.MeshBasicMaterial({ color: 0x2ed573, transparent: true })
                );
                hpBar.position.y = 2.0;
                hpBar.name = 'hpBar';
                group.add(hpBar);

                // Случайная позиция
                let x, z, safe = false;
                let attempts = 0;
                while (!safe && attempts < 50) {
                    x = (Math.random() - 0.5) * 30;
                    z = (Math.random() - 0.5) * 30;
                    safe = Math.abs(x) > 5 || Math.abs(z) > 5; // не слишком близко к центру
                    attempts++;
                }
                group.position.set(x, 0, z);
                scene.add(group);

                bots.push({
                    mesh: group,
                    x: x,
                    z: z,
                    hp: 30,
                    maxHp: 30,
                    angle: Math.random() * Math.PI * 2,
                    speed: 0.04 + Math.random() * 0.03,
                    state: 'patrol', // patrol, attack, flee
                    stateTimer: 100 + Math.random() * 100,
                    shootCooldown: 0,
                    alertDistance: 12,
                    attackDistance: 8,
                    fleeDistance: 5
                });
            }
        }

        function updateBotHPBar(bot) {
            const bar = bot.mesh.getObjectByName('hpBar');
            if (bar) {
                const ratio = Math.max(0, bot.hp / bot.maxHp);
                bar.material.color.setHex(ratio > 0.5 ? 0x2ed573 : (ratio > 0.25 ? 0xffa502 : 0xff4757));
                bar.scale.x = ratio;
            }
        }

        // ============================================================
        //  УПРАВЛЕНИЕ
        // ============================================================
        function setupControls() {
            const canvas = document.getElementById('gameCanvas');

            // --- КЛАВИАТУРА (ПК) ---
            document.addEventListener('keydown', (e) => {
                if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') moveForward = true;
                if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') moveBackward = true;
                if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') moveLeft = true;
                if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') moveRight = true;
                if (e.key === 'r' || e.key === 'R') startReload();
                if (e.key === 'b' || e.key === 'B') openShop();
                if (e.key === ' ') { e.preventDefault(); if (device === 'pc') shoot(); }
            });
            document.addEventListener('keyup', (e) => {
                if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') moveForward = false;
                if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') moveBackward = false;
                if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') moveLeft = false;
                if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') moveRight = false;
            });

            // --- МЫШЬ (ПК) ---
            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            });
            canvas.addEventListener('mousedown', (e) => {
                if (e.button === 0) { mouse.down = true; if (device === 'pc') shoot(); }
            });
            canvas.addEventListener('mouseup', (e) => {
                if (e.button === 0) mouse.down = false;
            });
            canvas.addEventListener('contextmenu', (e) => e.preventDefault());

            // --- ДЖОЙСТИК (ТЕЛЕФОН) ---
            const joystickBase = document.getElementById('joystick-base');
            const joystickThumb = document.getElementById('joystick-thumb');
            let joystickTouchId = null;

            joystickBase.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touchObj = e.changedTouches[0];
                joystickTouchId = touchObj.identifier;
                joystickActive = true;
                updateJoystick(touchObj.clientX, touchObj.clientY);
            }, { passive: false });

            document.addEventListener('touchmove', (e) => {
                if (!joystickActive) return;
                for (let touch of e.changedTouches) {
                    if (touch.identifier === joystickTouchId) {
                        updateJoystick(touch.clientX, touch.clientY);
                    }
                }
            }, { passive: false });

            document.addEventListener('touchend', (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === joystickTouchId) {
                        joystickActive = false;
                        joystickTouchId = null;
                        moveForward = moveBackward = moveLeft = moveRight = false;
                        joystickThumb.style.transform = 'translate(-50%, -50%)';
                    }
                }
            }, { passive: false });

            function updateJoystick(clientX, clientY) {
                const rect = joystickBase.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                let dx = clientX - cx;
                let dy = clientY - cy;
                const maxR = rect.width / 2 - 15;
                const dist = Math.sqrt(dx*dx + dy*dy);
                let clampedDist = Math.min(dist, maxR);
                const angle = Math.atan2(dy, dx);
                const moveX = Math.cos(angle) * clampedDist;
                const moveY = Math.sin(angle) * clampedDist;
                joystickThumb.style.transform = `translate(${-50 + (moveX/maxR)*50}%, ${-50 + (moveY/maxR)*50}%)`;

                const threshold = 20;
                const normX = Math.abs(dx) > threshold ? dx / maxR : 0;
                const normY = Math.abs(dy) > threshold ? dy / maxR : 0;
                moveForward = normY < -0.2;
                moveBackward = normY > 0.2;
                moveLeft = normX < -0.2;
                moveRight = normX > 0.2;
            }

            // --- КНОПКИ ТЕЛЕФОНА ---
            document.getElementById('fireBtn').addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (device === 'phone') shoot();
            }, { passive: false });
            document.getElementById('reloadBtn').addEventListener('touchstart', (e) => {
                e.preventDefault();
                startReload();
            }, { passive: false });
            document.getElementById('shopTouchBtn').addEventListener('touchstart', (e) => {
                e.preventDefault();
                openShop();
            }, { passive: false });

            // --- ПРИЦЕЛИВАНИЕ НА ТЕЛЕФОНЕ (касание экрана) ---
            canvas.addEventListener('touchstart', (e) => {
                if (device !== 'phone') return;
                const t = e.changedTouches[0];
                touch.active = true;
                touch.startX = t.clientX;
                touch.startY = t.clientY;
                touch.endX = t.clientX;
                touch.endY = t.clientY;
            }, { passive: true });

            canvas.addEventListener('touchmove', (e) => {
                if (device !== 'phone' || !touch.active) return;
                const t = e.changedTouches[0];
                touch.endX = t.clientX;
                touch.endY = t.clientY;
                // Обновляем угол игрока в сторону касания
                const rect = canvas.getBoundingClientRect();
                const cx = rect.left + rect.width/2;
                const cy = rect.top + rect.height/2;
                const dx = touch.endX - cx;
                const dy = touch.endY - cy;
                player.angle = Math.atan2(dx, -dy); // для изометрии
            }, { passive: true });

            canvas.addEventListener('touchend', (e) => {
                touch.active = false;
            }, { passive: true });
        }

        // ============================================================
        //  СТРЕЛЬБА И ПУЛИ
        // ============================================================
        function shoot() {
            if (player.reloading) return;
            if (player.ammo <= 0) {
                startReload();
                return;
            }
            const weapon = player.weaponData[player.weapon];
            if (player.shootCooldown > 0) return;

            player.ammo--;
            player.shootCooldown = weapon.fireRate;

            // Создаём пулю
            const dir = new THREE.Vector3(Math.sin(player.angle), 0, Math.cos(player.angle));
            const startPos = new THREE.Vector3(
                player.mesh.position.x + dir.x * 1.5,
                1.0,
                player.mesh.position.z + dir.z * 1.5
            );

            const bulletGeo = new THREE.SphereGeometry(0.2, 4, 4);
            const bulletMat = new THREE.MeshStandardMaterial({
                color: 0xffdd44,
                emissive: 0xff8800,
                emissiveIntensity: 0.5
            });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);
            bullet.position.copy(startPos);
            bullet.castShadow = false;
            scene.add(bullet);

            bullets.push({
                mesh: bullet,
                pos: startPos.clone(),
                dir: dir.clone(),
                speed: 0.8,
                life: 80,
                damage: weapon.damage,
                range: weapon.range,
                isPlayer: true
            });

            // Обновление HUD
            updateHUD();
        }

        function botShoot(bot) {
            if (bot.shootCooldown > 0) return;
            const dir = new THREE.Vector3(Math.sin(bot.angle), 0, Math.cos(bot.angle));
            const startPos = new THREE.Vector3(
                bot.mesh.position.x + dir.x * 1.2,
                1.0,
                bot.mesh.position.z + dir.z * 1.2
            );
            const bulletGeo = new THREE.SphereGeometry(0.15, 4, 4);
            const bulletMat = new THREE.MeshStandardMaterial({
                color: 0xff4444,
                emissive: 0xff0000,
                emissiveIntensity: 0.3
            });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);
            bullet.position.copy(startPos);
            scene.add(bullet);

            bullets.push({
                mesh: bullet,
                pos: startPos.clone(),
                dir: dir.clone(),
                speed: 0.6,
                life: 60,
                damage: 10,
                range: 15,
                isPlayer: false
            });
            bot.shootCooldown = 30 + Math.random() * 30;
        }

        function startReload() {
            if (player.reloading || player.ammo === player.maxAmmo) return;
            player.reloading = true;
            player.reloadTimer = player.weaponData[player.weapon].reloadTime;
        }

        // ============================================================
        //  МАГАЗИН
        // ============================================================
        function openShop() {
            document.getElementById('shop-overlay').style.display = 'flex';
            updateShopInfo();
        }

        function closeShop() {
            document.getElementById('shop-overlay').style.display = 'none';
            // Применить оружие
            const slider = document.getElementById('weaponSlider');
            const val = parseInt(slider.value);
            if (val !== player.weapon) {
                player.weapon = val;
                const w = player.weaponData[player.weapon];
                player.maxAmmo = w.magSize;
                player.ammo = w.magSize;
                player.reloading = false;
                updateHUD();
            }
        }

        function updateShopInfo() {
            const slider = document.getElementById('weaponSlider');
            const val = parseInt(slider.value);
            const w = player.weaponData[val];
            document.getElementById('weaponName').textContent = w.name;
            document.getElementById('weaponDamage').textContent = w.damage;
            document.getElementById('weaponMagSize').textContent = w.magSize;
        }

        document.getElementById('weaponSlider').addEventListener('input', updateShopInfo);

        // ============================================================
        //  ОБНОВЛЕНИЕ HUD
        // ============================================================
        function updateHUD() {
            document.getElementById('hpDisplay').textContent = player.hp;
            document.getElementById('ammoDisplay').textContent = player.reloading ? '⏳' : player.ammo;
            document.getElementById('killsDisplay').textContent = player.kills;
            document.getElementById('weaponDisplay').textContent = '🔫 ' + player.weaponData[player.weapon].name;
        }

        // ============================================================
        //  ПЕРЕЗАПУСК ИГРЫ
        // ============================================================
        function restartGame() {
            document.getElementById('death-screen').style.display = 'none';
            player.hp = player.maxHp;
            player.ammo = player.weaponData[player.weapon].magSize;
            player.kills = 0;
            player.reloading = false;
            player.shootCooldown = 0;
            player.mesh.position.set(0, 0, 0);
            player.x = 0;
            player.z = 0;
            gameRunning = true;

            // Пересоздать ботов
            bots.forEach(bot => scene.remove(bot.mesh));
            createBots();

            // Очистить пули
            bullets.forEach(b => scene.remove(b.mesh));
            bullets = [];

            updateHUD();
            document.getElementById('death-screen').style.display = 'none';
        }

        // ============================================================
        //  ЛОГИКА ИГРЫ (ОБНОВЛЕНИЕ)
        // ============================================================
        function updateGame() {
            if (!gameRunning) return;

            // Перезарядка
            if (player.reloading) {
                player.reloadTimer--;
                if (player.reloadTimer <= 0) {
                    player.ammo = player.weaponData[player.weapon].magSize;
                    player.reloading = false;
                    updateHUD();
                }
            }
            if (player.shootCooldown > 0) player.shootCooldown--;

            // Движение игрока
            let dx = 0, dz = 0;
            if (moveForward) dz = -0.08;
            if (moveBackward) dz = 0.08;
            if (moveLeft) dx = -0.08;
            if (moveRight) dx = 0.08;
            if (dx !== 0 && dz !== 0) { dx *= 0.707; dz *= 0.707; }

            const newX = player.mesh.position.x + dx;
            const newZ = player.mesh.position.z + dz;
            // Коллизия со стенами
            let blocked = false;
            for (let wall of walls) {
                const halfW = wall.geometry.parameters.width / 2;
                const halfD = wall.geometry.parameters.depth / 2;
                const wx = wall.position.x;
                const wz = wall.position.z;
                if (Math.abs(newX - wx) < halfW + 0.8 && Math.abs(newZ - wz) < halfD + 0.8) {
                    blocked = true;
                    break;
                }
            }
            // Границы карты
            if (Math.abs(newX) > 18 || Math.abs(newZ) > 18) blocked = true;

            if (!blocked) {
                player.mesh.position.x = newX;
                player.mesh.position.z = newZ;
                player.x = newX;
                player.z = newZ;
            }

            // Угол игрока (на ПК - мышью, на телефоне - касанием)
            if (device === 'pc') {
                const rect = document.getElementById('gameCanvas').getBoundingClientRect();
                const cx = rect.left + rect.width/2;
                const cy = rect.top + rect.height/2;
                const dxMouse = mouse.x * rect.width/2;
                const dyMouse = -mouse.y * rect.height/2;
                // В изометрической камере угол немного искажается, но упростим
                const worldX = dxMouse * 0.8;
                const worldZ = dyMouse * 0.8;
                player.angle = Math.atan2(worldX, worldZ);
            } else {
                // на телефоне угол уже обновляется через touchmove
            }

            // Повернуть игрока
            player.mesh.rotation.y = player.angle;

            // Обновить HP бар игрока
            updatePlayerHPBar();

            // --- БОТЫ ---
            const playerPos = new THREE.Vector3(player.mesh.position.x, 0, player.mesh.position.z);
            for (let bot of bots) {
                if (bot.hp <= 0) continue;
                const botPos = new THREE.Vector3(bot.mesh.position.x, 0, bot.mesh.position.z);
                const dist = playerPos.distanceTo(botPos);

                // Состояние
                bot.stateTimer--;
                if (bot.stateTimer <= 0) {
                    const r = Math.random();
                    if (r < 0.4) bot.state = 'patrol';
                    else if (r < 0.7) bot.state = 'attack';
                    else bot.state = 'flee';
                    bot.stateTimer = 80 + Math.random() * 80;
                }

                // Поворот к игроку, если в зоне видимости
                const angleToPlayer = Math.atan2(
                    playerPos.x - botPos.x,
                    playerPos.z - botPos.z
                );
                if (dist < bot.alertDistance) {
                    bot.angle = angleToPlayer;
                }

                // Движение
                let moveX = 0, moveZ = 0;
                if (bot.state === 'attack' && dist < bot.attackDistance) {
                    // Идёт к игроку
                    moveX = Math.sin(bot.angle) * bot.speed;
                    moveZ = Math.cos(bot.angle) * bot.speed;
                } else if (bot.state === 'flee' && dist < bot.fleeDistance) {
                    moveX = -Math.sin(bot.angle) * bot.speed;
                    moveZ = -Math.cos(bot.angle) * bot.speed;
                } else {
                    // Патруль (случайное блуждание)
                    if (Math.random() < 0.01) bot.angle += (Math.random() - 0.5) * 1.5;
                    moveX = Math.sin(bot.angle) * bot.speed * 0.5;
                    moveZ = Math.cos(bot.angle) * bot.speed * 0.5;
                }

                // Коллизия ботов со стенами
                let newBX = bot.mesh.position.x + moveX;
                let newBZ = bot.mesh.position.z + moveZ;
                let blockedBot = false;
                for (let wall of walls) {
                    const halfW = wall.geometry.parameters.width / 2;
                    const halfD = wall.geometry.parameters.depth / 2;
                    const wx = wall.position.x;
                    const wz = wall.position.z;
                    if (Math.abs(newBX - wx) < halfW + 0.7 && Math.abs(newBZ - wz) < halfD + 0.7) {
                        blockedBot = true;
                        break;
                    }
                }
                if (Math.abs(newBX) > 18 || Math.abs(newBZ) > 18) blockedBot = true;
                if (!blockedBot) {
                    bot.mesh.position.x = newBX;
                    bot.mesh.position.z = newBZ;
                    bot.x = newBX;
                    bot.z = newBZ;
                }

                // Атака (стрельба)
                if (bot.state === 'attack' && dist < bot.attackDistance && bot.shootCooldown === 0) {
                    botShoot(bot);
                }
                if (bot.shootCooldown > 0) bot.shootCooldown--;

                // Поворот бота
                bot.mesh.rotation.y = bot.angle;
                updateBotHPBar(bot);
            }

            // --- ПУЛИ ---
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.pos.add(b.dir.clone().multiplyScalar(b.speed));
                b.mesh.position.copy(b.pos);
                b.life--;

                // Попадание в стены
                let hitWall = false;
                for (let wall of walls) {
                    const halfW = wall.geometry.parameters.width / 2;
                    const halfD = wall.geometry.parameters.depth / 2;
                    const wx = wall.position.x;
                    const wz = wall.position.z;
                    if (Math.abs(b.pos.x - wx) < halfW + 0.3 && Math.abs(b.pos.z - wz) < halfD + 0.3) {
                        hitWall = true;
                        break;
                    }
                }
                if (b.pos.x < -19 || b.pos.x > 19 || b.pos.z < -19 || b.pos.z > 19) hitWall = true;

                if (hitWall || b.life <= 0) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                    continue;
                }

                // Попадание в цель
                if (b.isPlayer) {
                    // Пуля игрока → боты
                    for (let bot of bots) {
                        if (bot.hp <= 0) continue;
                        const d = b.pos.distanceTo(new THREE.Vector3(bot.mesh.position.x, 1, bot.mesh.position.z));
                        if (d < 1.0) {
                            bot.hp -= b.damage;
                            scene.remove(b.mesh);
                            bullets.splice(i, 1);
                            if (bot.hp <= 0) {
                                player.kills++;
                                updateHUD();
                            }
                            break;
                        }
                    }
                } else {
                    // Пуля бота → игрок
                    const d = b.pos.distanceTo(new THREE.Vector3(player.mesh.position.x, 1, player.mesh.position.z));
                    if (d < 1.0) {
                        player.hp -= b.damage;
                        scene.remove(b.mesh);
                        bullets.splice(i, 1);
                        updateHUD();
                        if (player.hp <= 0) {
                            gameRunning = false;
                            document.getElementById('deathKills').textContent = player.kills;
                            document.getElementById('death-screen').style.display = 'flex';
                        }
                        break;
                    }
                }
            }
        }

        // ============================================================
        //  АНИМАЦИОННЫЙ ЦИКЛ
        // ============================================================
        function animate() {
            requestAnimationFrame(animate);

            updateGame();

            renderer.render(scene, camera);
        }

        // ============================================================
        //  АДАПТАЦИЯ РАЗМЕРОВ
        // ============================================================
        window.addEventListener('resize', () => {
            const container = document.getElementById('game-container');
            const canvas = document.getElementById('gameCanvas');
            const w = container.clientWidth;
            const h = container.clientHeight;
            if (camera) {
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
            }
            if (renderer) {
                renderer.setSize(w, h);
            }
        });

        // Поворот экрана при выборе телефона уже в selectDevice

        // ============================================================
        //  ЗАПУСК (ожидаем выбора устройства)
        // ============================================================
        console.log('Игра готова к запуску. Выберите устройство.');
    </script>
</body>
</html>
