<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/s.png">
<title>Contra</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#0a0a0a; font-family: 'Segoe UI', Arial, sans-serif; }
#gameCanvas { display:block; width:100%; height:100%; cursor:crosshair; }

/* ===== MAIN MENU (центрированное, с вкладками) ===== */
#menu {
  position:fixed; inset:0; z-index:50;
  display:flex; align-items:center; justify-content:center;
  background:#0a0908; color:#eee;
}
.menu-bg {
  position:absolute; inset:0;
  background-image: radial-gradient(circle at 30% 40%, rgba(255,140,26,0.12) 0%, transparent 70%),
                    linear-gradient(rgba(255,140,26,0.05) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,140,26,0.05) 1px, transparent 1px);
  background-size: 100% 100%, 48px 48px, 48px 48px;
  pointer-events:none;
}
.menu-content {
  position:relative; z-index:2;
  width:90%; max-width:720px; background:rgba(15,13,10,0.85);
  border:1px solid rgba(255,140,26,0.3); border-radius:12px;
  padding:30px 40px 40px;
  box-shadow:0 0 60px rgba(255,140,26,0.15);
  backdrop-filter:blur(4px);
  text-align:center;
}
.menu-content h1 {
  font-size:64px; font-weight:900; color:#fff; letter-spacing:3px;
  text-shadow:0 0 40px rgba(255,140,26,0.5);
  margin-bottom:8px;
}
.menu-content h1 span { color:#ff8c1a; }
.menu-content .sub {
  color:#8a7455; letter-spacing:6px; font-size:12px; text-transform:uppercase;
  margin-bottom:20px;
}
.balance-bar {
  display:flex; justify-content:flex-end; margin-bottom:15px;
  color:#8fe38f; font-size:18px; font-weight:bold;
  border-bottom:1px solid rgba(255,140,26,0.2); padding-bottom:12px;
}
.balance-bar span { color:#ffb86b; margin-left:8px; }
.tabs {
  display:flex; gap:6px; justify-content:center; margin-bottom:22px;
}
.tabs button {
  background:transparent; border:1px solid #333; color:#999;
  padding:8px 20px; border-radius:6px; cursor:pointer; font-size:14px;
  transition:0.2s; letter-spacing:1px;
}
.tabs button:hover { border-color:#ff8c1a; color:#ff8c1a; }
.tabs button.active { background:#ff8c1a; color:#111; border-color:#ff8c1a; font-weight:bold; }
.tab-panel { display:none; }
.tab-panel.active { display:block; }
#tab-play input {
  background:#151515; border:2px solid #ff8c1a; color:#fff;
  padding:14px 20px; font-size:18px; width:100%; max-width:300px;
  outline:none; border-radius:6px; margin-bottom:16px;
}
#tab-play button {
  background:linear-gradient(180deg,#ff9d33,#e07000);
  border:none; color:#111; font-weight:bold; font-size:22px;
  padding:14px 40px; border-radius:6px; cursor:pointer;
  box-shadow:0 4px 0 #a44f00; transition:0.1s;
}
#tab-play button:active { transform:translateY(4px); box-shadow:0 1px 0 #a44f00; }
.hint {
  margin-top:16px; color:#666; font-size:13px; letter-spacing:0.5px; line-height:1.8;
}
.hint b { color:#ff8c1a; }

/* Стили для магазина скинов, инвентаря, кейсов */
.skin-grid {
  display:flex; flex-wrap:wrap; gap:12px; justify-content:center;
  max-height:300px; overflow-y:auto; padding:4px;
}
.skin-card {
  background:#161410; border:1px solid #332c1e; border-radius:8px;
  padding:12px 16px; min-width:140px; flex:1 1 auto; text-align:center;
}
.skin-card .sname { font-weight:bold; color:#fff; font-size:14px; }
.skin-card .sprice { color:#ffb86b; font-size:13px; margin:4px 0; }
.skin-card button {
  background:#ff8c1a; border:none; color:#111; padding:5px 14px; border-radius:4px;
  font-weight:bold; cursor:pointer; font-size:12px;
}
.skin-card button.equipped { background:#3a6b3a; color:#fff; cursor:default; }
.skin-card button.owned { background:#2a3a2a; color:#b6ff9e; }
.skin-card button:disabled { opacity:0.4; cursor:not-allowed; }
.case-card {
  background:#161410; border:1px solid #ff8c1a; border-radius:8px;
  padding:20px; display:inline-block; margin:8px; min-width:160px;
  text-align:center;
}
.case-card .cname { color:#fff; font-size:18px; font-weight:bold; }
.case-card .cprice { color:#ffb86b; margin:8px 0; }
.case-card button { background:#ff8c1a; border:none; color:#111; padding:8px 24px; border-radius:6px; font-weight:bold; cursor:pointer; }
.inv-item {
  display:inline-block; background:#161410; border:1px solid #333; border-radius:6px;
  padding:8px 14px; margin:4px; font-size:13px;
}
.inv-item .iname { color:#fff; }
.inv-item .iapply { color:#8fe38f; cursor:pointer; margin-left:8px; }
.inv-item .iapply:hover { color:#ff8c1a; }

/* ===== HUD ===== */
#hud {
  position:fixed; top:0; left:0; right:0; z-index:20;
  display:none; justify-content:space-between; padding:12px 20px;
  pointer-events:none; color:#fff; font-size:18px;
  text-shadow:0 2px 4px rgba(0,0,0,0.9);
}
#hud .box { display:flex; gap:12px; flex-wrap:wrap; }
#hud .stat { background:rgba(10,10,10,0.55); border:1px solid rgba(255,140,26,0.4);
  padding:6px 14px; border-radius:4px; min-width:70px; text-align:center; }
#hpBar { width:120px; height:8px; background:#300; border:1px solid #700; border-radius:3px; overflow:hidden; margin-top:4px;}
#hpFill { height:100%; width:100%; background:linear-gradient(90deg,#ff3b3b,#ff8c1a); transition:width 0.15s; }
#shopBtn {
  pointer-events:auto; cursor:pointer; background:rgba(20,30,10,0.7); border:1px solid rgba(120,255,120,0.5);
  color:#b6ff9e;
}
#shopBtn:hover { background:rgba(30,50,15,0.85); }
#reloadMsg {
  position:fixed; top:80px; left:50%; transform:translateX(-50%); z-index:20;
  color:#ff8c1a; font-size:20px; font-weight:bold; letter-spacing:2px;
  text-shadow:0 0 10px rgba(255,140,26,0.8); display:none;
}
#crosshair {
  position:fixed; z-index:15; width:18px; height:18px; pointer-events:none;
  top:50%; left:50%; transform:translate(-50%,-50%); display:none;
}
#crosshair::before, #crosshair::after {
  content:''; position:absolute; background:#ff8c1a;
}
#crosshair::before { width:100%; height:2px; top:8px; }
#crosshair::after { height:100%; width:2px; left:8px; }

/* ===== BUY TIMER ===== */
#buyTimerOverlay {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:100;
  display:none; background:rgba(0,0,0,0.75); padding:30px 50px; border-radius:16px;
  border:2px solid #ff8c1a; text-align:center;
}
#buyTimerOverlay .label { color:#c98d4a; font-size:16px; letter-spacing:3px; text-transform:uppercase; }
#buyTimerDisplay { color:#fff; font-size:64px; font-weight:bold; margin:10px 0; text-shadow:0 0 30px rgba(255,140,26,0.6); }
#buyTimerOverlay .sub { color:#999; font-size:14px; }

/* ===== PAUSE BUTTON ===== */
#pauseBtn {
  position:fixed; bottom:20px; left:20px; z-index:25;
  width:40px; height:40px; display:none; align-items:center; justify-content:center;
  background:rgba(0,0,0,0.5); border:1px solid rgba(255,140,26,0.3);
  border-radius:50%; cursor:pointer; color:#ff8c1a; font-size:16px;
  pointer-events:auto;
}
#pauseBtn:hover { background:rgba(30,25,15,0.8); border-color:#ff8c1a; }
#pauseOverlay {
  position:fixed; inset:0; z-index:65; display:none;
  align-items:center; justify-content:center;
  background:rgba(0,0,0,0.8);
}
#pausePanel {
  width:380px; max-width:88vw; background:#0d0c09;
  border:1px solid rgba(255,140,26,0.4); border-radius:4px;
  padding:38px 36px; text-align:center;
  box-shadow:0 0 60px rgba(255,140,26,0.2);
}
#pausePanel h2 { color:#fff; letter-spacing:5px; font-size:32px; font-weight:900; margin-bottom:30px; }
#pausePanel button {
  display:block; width:100%; padding:14px; margin-bottom:12px; border:none; border-radius:2px;
  font-size:15px; font-weight:bold; letter-spacing:2px; text-transform:uppercase; cursor:pointer;
}
#resumeBtn { background:linear-gradient(180deg,#ff9d33,#e07000); color:#111; box-shadow:0 4px 0 #a44f00; }
#pauseShopBtn { background:#2a3a2a; color:#b6ff9e; border:1px solid #3a5f3a; }
#pauseMenuBtn { background:transparent; color:#999; border:1px solid #444; margin-bottom:0; }
#pauseMenuBtn:hover { border-color:#ff8c1a; color:#ff8c1a; }

/* ===== IN-GAME SHOP ===== */
#shopOverlay {
  position:fixed; inset:0; z-index:70; display:none;
  align-items:center; justify-content:center;
  background:rgba(0,0,0,0.82);
}
#shopPanel {
  position:relative; width:92vw; height:90vh; max-width:1400px;
  overflow-y:auto; background:#0d0c09;
  border:1px solid rgba(255,140,26,0.35); border-radius:4px;
  padding:20px 30px;
}
#shopPanel h2 { color:#fff; letter-spacing:3px; font-size:28px; margin-bottom:12px; }
#shopPanel h2 span { color:#ff8c1a; }
#shopMoney { color:#8fe38f; font-size:18px; font-weight:bold; margin-bottom:16px; }
.shop-grid { display:flex; flex-wrap:wrap; gap:14px; }
.shop-item {
  background:#161410; border:1px solid #332c1e; border-radius:6px;
  padding:14px; width:160px; text-align:center;
}
.shop-item .iname { color:#fff; font-weight:bold; }
.shop-item .iprice { color:#ffb86b; margin:4px 0; }
.shop-item button { background:#ff8c1a; border:none; color:#111; padding:6px 16px; border-radius:4px; font-weight:bold; cursor:pointer; }
.shop-item button:disabled { opacity:0.4; cursor:not-allowed; }

/* ===== GAME OVER ===== */
#gameOver {
  position:fixed; inset:0; z-index:60; display:none;
  align-items:center; justify-content:center; flex-direction:column;
  background:rgba(5,0,0,0.88); color:#fff;
}
#gameOver h2 { font-size:56px; color:#ff3b3b; letter-spacing:4px; text-shadow:0 0 25px rgba(255,59,59,0.6); margin-bottom:10px; }
#gameOver .killsLine { font-size:22px; color:#ff8c1a; margin-bottom:34px; letter-spacing:1px; }
#gameOver .btnRow { display:flex; gap:18px; }
#gameOver button {
  background:linear-gradient(180deg,#ff9d33,#e07000); border:none; color:#111;
  font-weight:bold; font-size:18px; padding:12px 34px; cursor:pointer;
  border-radius:2px; letter-spacing:1px; box-shadow:0 4px 0 #a44f00;
}
#gameOver #menuBtn { background:linear-gradient(180deg,#555,#222); color:#eee; box-shadow:0 4px 0 #000; }

/* ===== TOAST ===== */
#toast {
  position:fixed; bottom:40px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.85); color:#ff8c1a; padding:14px 28px;
  border-radius:8px; border:1px solid #ff8c1a; display:none;
  z-index:999; font-size:16px; text-align:center;
  max-width:90%;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 600px) {
  .menu-content { padding:20px; }
  .menu-content h1 { font-size:40px; }
  .tabs button { font-size:12px; padding:6px 12px; }
  .skin-card { min-width:100px; }
}
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<!-- MAIN MENU -->
<div id="menu">
  <div class="menu-bg"></div>
  <div class="menu-content">
    <h1>CON<span>TRA</span></h1>
    <div class="sub">Тактический шутер</div>
    <div class="balance-bar">💰 Баланс: <span id="globalBalance">0</span></div>
    <div class="tabs">
      <button class="tab active" data-tab="play">Играть</button>
      <button class="tab" data-tab="shop">Магазин</button>
      <button class="tab" data-tab="inventory">Инвентарь</button>
      <button class="tab" data-tab="cases">Кейсы</button>
    </div>
    <!-- Панель Играть -->
    <div id="tab-play" class="tab-panel active">
      <input id="nickInput" type="text" maxlength="16" placeholder="Никнейм" value="Player">
      <br>
      <button id="startBtn">В бой!</button>
      <div class="hint">
        <b>WASD</b> — движение · <b>Мышь</b> — прицел · <b>ЛКМ</b> — выстрел · <b>R</b> — перезарядка · <b>B</b> — магазин
      </div>
    </div>
    <!-- Панель Магазин скинов -->
    <div id="tab-shop" class="tab-panel">
      <div id="skinShopContainer" class="skin-grid"></div>
    </div>
    <!-- Панель Инвентарь -->
    <div id="tab-inventory" class="tab-panel">
      <div id="inventoryContainer"></div>
    </div>
    <!-- Панель Кейсы -->
    <div id="tab-cases" class="tab-panel">
      <div id="caseContainer"></div>
    </div>
  </div>
</div>

<!-- HUD -->
<div id="hud">
  <div class="box">
    <div class="stat">❤️ HP: <span id="hpVal">100</span>
      <div id="hpBar"><div id="hpFill"></div></div>
    </div>
    <div class="stat">🔫 <span id="ammoVal">12</span></div>
    <div class="stat">💀 <span id="killsVal">0</span></div>
    <div class="stat">💵 $<span id="moneyVal">2000</span></div>
    <div class="stat" id="shopBtn">🛒 Магазин (B)</div>
  </div>
  <div class="stat" id="nickBox">—</div>
</div>
<div id="reloadMsg">⏳ ПЕРЕЗАРЯДКА</div>
<div id="crosshair"></div>
<div id="pauseBtn">⏸</div>

<!-- BUY TIMER -->
<div id="buyTimerOverlay">
  <div class="label">⏳ Закупка</div>
  <div id="buyTimerDisplay">5</div>
  <div class="sub">Магазин открыт</div>
</div>

<!-- PAUSE OVERLAY -->
<div id="pauseOverlay">
  <div id="pausePanel">
    <h2>ПАУЗА</h2>
    <button id="resumeBtn">Продолжить</button>
    <button id="pauseShopBtn">🛒 Магазин</button>
    <button id="pauseMenuBtn">Главное меню</button>
  </div>
</div>

<!-- IN-GAME SHOP -->
<div id="shopOverlay">
  <div id="shopPanel">
    <h2>МАГА<span>ЗИН</span></h2>
    <div id="shopMoney">Баланс: $2000</div>
    <div class="shop-grid" id="shopContainer"></div>
    <button id="closeShopBtn" style="margin-top:20px; background:transparent; color:#999; border:1px solid #444; padding:10px 30px; border-radius:4px; cursor:pointer;">Закрыть (B / Esc)</button>
  </div>
</div>

<!-- GAME OVER -->
<div id="gameOver">
  <h2>Ты погиб!</h2>
  <div class="killsLine">Убийств: <span id="finalKills">0</span> · Заработано: $<span id="finalMoney">0</span></div>
  <div class="btnRow">
    <button id="restartBtn">Играть снова</button>
    <button id="menuBtn">Главное меню</button>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  'use strict';

  // ============ SKINS DATA ============
  const SKINS = {
    pistol: [
      { id: 'pistol_default', name: 'Стандартный', price: 0, color: 0x2b2b2b },
      { id: 'pistol_gold', name: 'Золотой', price: 500, color: 0xffd700 },
      { id: 'pistol_red', name: 'Красный', price: 300, color: 0xff3333 },
      { id: 'pistol_blue', name: 'Синий', price: 200, color: 0x3366ff },
    ],
    smg: [
      { id: 'smg_default', name: 'Стандартный', price: 0, color: 0x445577 },
      { id: 'smg_neon', name: 'Неоновый', price: 600, color: 0xff00ff },
      { id: 'smg_camo', name: 'Камуфляж', price: 400, color: 0x556b2f },
    ],
    rifle: [
      { id: 'rifle_default', name: 'Стандартный', price: 0, color: 0x3f4a34 },
      { id: 'rifle_forest', name: 'Лесной', price: 700, color: 0x228b22 },
      { id: 'rifle_ice', name: 'Ледяной', price: 800, color: 0x87ceeb },
    ],
    sniper: [
      { id: 'sniper_default', name: 'Стандартный', price: 0, color: 0x111111 },
      { id: 'sniper_blood', name: 'Кровавый', price: 900, color: 0x8b0000 },
    ]
  };
  const WEAPON_TYPES = ['pistol','smg','rifle','sniper'];
  const CASE_PRICE = 200;

  // ============ INVENTORY / BALANCE (localStorage) ============
  function loadInventory() {
    try {
      const raw = localStorage.getItem('contra_inventory');
      if (raw) {
        const data = JSON.parse(raw);
        // ensure structure
        if (!data.weapons) data.weapons = {};
        WEAPON_TYPES.forEach(w => { if (!data.weapons[w]) data.weapons[w] = []; });
        if (!data.equipped) data.equipped = {};
        if (typeof data.balance !== 'number') data.balance = 0;
        return data;
      }
    } catch(e) {}
    // default
    return {
      weapons: { pistol: ['pistol_default'], smg: ['smg_default'], rifle: ['rifle_default'], sniper: ['sniper_default'] },
      equipped: { pistol: 'pistol_default', smg: 'smg_default', rifle: 'rifle_default', sniper: 'sniper_default' },
      balance: 0
    };
  }
  function saveInventory(inv) {
    localStorage.setItem('contra_inventory', JSON.stringify(inv));
  }
  function getGlobalBalance() { return loadInventory().balance; }
  function addGlobalBalance(amount) {
    const inv = loadInventory();
    inv.balance += amount;
    saveInventory(inv);
    updateBalanceDisplay();
  }

  // ============ UI UPDATES ============
  function updateBalanceDisplay() {
    document.getElementById('globalBalance').textContent = getGlobalBalance();
  }

  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.style.display = 'block';
    clearTimeout(el._timeout);
    el._timeout = setTimeout(() => el.style.display = 'none', 3000);
  }

  // ============ TAB SWITCHING ============
  const tabs = document.querySelectorAll('.tab');
  const panels = {
    play: document.getElementById('tab-play'),
    shop: document.getElementById('tab-shop'),
    inventory: document.getElementById('tab-inventory'),
    cases: document.getElementById('tab-cases')
  };
  tabs.forEach(btn => {
    btn.addEventListener('click', () => {
      tabs.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.dataset.tab;
      Object.keys(panels).forEach(k => panels[k].classList.toggle('active', k === tab));
      if (tab === 'shop') renderSkinShop();
      if (tab === 'inventory') renderInventory();
      if (tab === 'cases') renderCases();
    });
  });

  // ============ RENDER SKIN SHOP ============
  function renderSkinShop() {
    const container = document.getElementById('skinShopContainer');
    container.innerHTML = '';
    const inv = loadInventory();
    WEAPON_TYPES.forEach(wType => {
      const section = document.createElement('div');
      section.style.width = '100%';
      section.innerHTML = `<h3 style="color:#c98d4a; letter-spacing:2px; margin:8px 0;">${wType.toUpperCase()}</h3>`;
      const grid = document.createElement('div');
      grid.style.cssText = 'display:flex; flex-wrap:wrap; gap:8px;';
      SKINS[wType].forEach(skin => {
        const card = document.createElement('div');
        card.className = 'skin-card';
        const owned = inv.weapons[wType].includes(skin.id);
        const equipped = inv.equipped[wType] === skin.id;
        card.innerHTML = `
          <div class="sname">${skin.name}</div>
          <div class="sprice">${skin.price === 0 ? 'Бесплатно' : '$'+skin.price}</div>
          <button data-w="${wType}" data-id="${skin.id}" ${owned ? 'class="owned"' : ''} ${equipped ? 'disabled class="equipped"' : ''}>
            ${equipped ? '✅ Применено' : (owned ? 'В инвентаре' : 'Купить')}
          </button>
        `;
        const btn = card.querySelector('button');
        btn.addEventListener('click', () => {
          if (equipped) return;
          if (owned) {
            // применить
            applySkin(wType, skin.id);
            renderSkinShop();
            renderInventory();
          } else {
            // купить
            if (inv.balance < skin.price) {
              showToast('❌ Недостаточно денег');
              return;
            }
            inv.balance -= skin.price;
            inv.weapons[wType].push(skin.id);
            saveInventory(inv);
            updateBalanceDisplay();
            showToast(`✅ Скин "${skin.name}" куплен!`);
            renderSkinShop();
            renderInventory();
          }
        });
        grid.appendChild(card);
      });
      section.appendChild(grid);
      container.appendChild(section);
    });
  }

  function applySkin(wType, skinId) {
    const inv = loadInventory();
    inv.equipped[wType] = skinId;
    saveInventory(inv);
    // Если игра запущена, обновить цвет оружия
    if (gameRunning && playerParts) {
      const skin = SKINS[wType].find(s => s.id === skinId);
      if (skin) playerParts.gun.material.color.setHex(skin.color);
    }
    showToast(`🎨 Скин "${SKINS[wType].find(s=>s.id===skinId).name}" применён к ${wType}`);
  }

  // ============ RENDER INVENTORY ============
  function renderInventory() {
    const container = document.getElementById('inventoryContainer');
    container.innerHTML = '';
    const inv = loadInventory();
    WEAPON_TYPES.forEach(wType => {
      const section = document.createElement('div');
      section.style.marginBottom = '12px';
      section.innerHTML = `<h4 style="color:#c98d4a; letter-spacing:1px;">${wType.toUpperCase()}</h4>`;
      const list = document.createElement('div');
      list.style.cssText = 'display:flex; flex-wrap:wrap; gap:6px;';
      const ownedSkins = inv.weapons[wType] || [];
      if (ownedSkins.length === 0) {
        const empty = document.createElement('span');
        empty.textContent = 'Нет скинов';
        empty.style.color = '#666';
        list.appendChild(empty);
      } else {
        ownedSkins.forEach(skinId => {
          const skin = SKINS[wType].find(s => s.id === skinId);
          if (!skin) return;
          const isEquipped = inv.equipped[wType] === skinId;
          const el = document.createElement('span');
          el.className = 'inv-item';
          el.innerHTML = `<span class="iname">${skin.name}</span> ${isEquipped ? '✅' : '<span class="iapply" data-w="'+wType+'" data-id="'+skinId+'">Применить</span>'}`;
          if (!isEquipped) {
            el.querySelector('.iapply').addEventListener('click', (e) => {
              e.stopPropagation();
              applySkin(wType, skinId);
              renderInventory();
              renderSkinShop();
            });
          }
          list.appendChild(el);
        });
      }
      section.appendChild(list);
      container.appendChild(section);
    });
  }

  // ============ RENDER CASES ============
  function renderCases() {
    const container = document.getElementById('caseContainer');
    container.innerHTML = '';
    // Два типа кейсов: обычный и премиум (для примера)
    const cases = [
      { id: 'standard', name: 'Оружейный кейс', price: CASE_PRICE, desc: 'Случайный скин для любого оружия' },
      { id: 'premium', name: 'Премиум кейс', price: CASE_PRICE + 100, desc: 'Шанс на редкий скин' }
    ];
    cases.forEach(c => {
      const card = document.createElement('div');

      card.innerHTML = `
        <div class="cname">${c.name}</div>
        <div class="cprice">💰 $${c.price}</div>
        <div style="color:#888; font-size:12px; margin-bottom:8px;">${c.desc}</div>
        <button data-id="${c.id}">Открыть</button>
      `;
      card.querySelector('button').addEventListener('click', () => {
        openCase(c.id);
      });
      container.appendChild(card);
    });
  }

  function openCase(caseId) {
    const inv = loadInventory();
    const price = caseId === 'standard' ? CASE_PRICE : CASE_PRICE + 100;
    if (inv.balance < price) {
      showToast('❌ Недостаточно денег');
      return;
    }
    inv.balance -= price;
    // Выбрать случайное оружие
    const wType = WEAPON_TYPES[Math.floor(Math.random() * WEAPON_TYPES.length)];
    const skins = SKINS[wType];
    const skin = skins[Math.floor(Math.random() * skins.length)];
    // Добавляем скин, если его ещё нет
    if (!inv.weapons[wType].includes(skin.id)) {
      inv.weapons[wType].push(skin.id);
    }
    saveInventory(inv);
    updateBalanceDisplay();
    showToast(`🎉 Вы получили скин "${skin.name}" для ${wType}!`);
    renderSkinShop();
    renderInventory();
    renderCases();
  }

  // ============ INIT THREE.JS ============
  function initScene(){

    const groundGeo = new THREE.PlaneGeometry(30,30);

      if(e.code === 'KeyB' && !paused) toggleShop();
      if(e.code === 'Escape'){
        if(shopOpen) closeShop();
        else togglePause();
      }
    });
    window.addEventListener('keyup', e => keys[e.code]=false);
  }

  function onResize(){
    camera.aspect = window.innerWidth/window.innerHeight;

  // ============ MAP BUILDING ============
  function addBoxObstacle(x,z,w,h,d,color){
    const geo = new THREE.BoxGeometry(w,h,d);
    const mat = new THREE.MeshStandardMaterial({ color, roughness:0.85 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, h/2, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    const box3 = new THREE.Box3().setFromObject(mesh);
    obstacles.push({mesh, box3});
    return mesh;
  }

  function buildMap(){
    const wallH = 3, wallT = 1;
    const wallColor = 0x8a7455;
    addBoxObstacle(0, -MAP_HALF-wallT/2, 30+wallT*2, wallH, wallT, wallColor);
    addBoxObstacle(0, MAP_HALF+wallT/2, 30+wallT*2, wallH, wallT, wallColor);
    addBoxObstacle(-MAP_HALF-wallT/2, 0, wallT, wallH, 30, wallColor);
    addBoxObstacle(MAP_HALF+wallT/2, 0, wallT, wallH, 30, wallColor);

    const crateColor = 0x9a6a35;
    const crateSpots = [
      [-8,-8,2,1.4,2], [8,-6,1.6,1.6,1.6], [-4,3,1.2,1.2,1.2],
      [5,7,2.2,1.8,1.4], [0,-2,1.4,1.4,1.4], [-10,6,1.6,2,1.6],
      [10,10,1.2,1.2,1.2], [-6,-11,2,1.4,1.4], [3,-9,1.4,1,1.4],
      [-2,9,2.4,1.6,1.2], [7,-2,1.2,1.2,1.2], [-11,-3,1.6,1.6,1.6]
    ];
    crateSpots.forEach(([x,z,w,h,d]) => addBoxObstacle(x,z,w,h,d,crateColor));
  }

  // ============ TEXTURE HELPERS ============
  function makeNameSprite(text, colorHex){
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.font = 'bold 32px Arial';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0,12,256,40);
    ctx.fillStyle = colorHex;
    ctx.fillText(text, 128, 40);
    const tex = new THREE.CanvasTexture(canvas);
    const mat = new THREE.SpriteMaterial({ map:tex, transparent:true, depthTest:false });
    const sprite = new THREE.Sprite(mat);
    sprite.scale.set(2.0,0.5,1);
    sprite.position.y = 2.35;
    sprite.renderOrder = 999;
    return sprite;
  }

  // ============ HUMANOID BUILDER ============
  function createHumanoid(skinColor, uniformColor, withGear){
    const group = new THREE.Group();
    const parts = {};

    const legGeo = new THREE.BoxGeometry(0.2,0.75,0.22);
    const legMat = new THREE.MeshStandardMaterial({ color:0x22262e, roughness:0.8 });
    const legL = new THREE.Mesh(legGeo, legMat);
    legL.position.set(-0.15, 0.375, 0);
    legL.castShadow = true;
    const legR = legL.clone();
    legR.position.x = 0.15;
    group.add(legL, legR);

    const torsoGeo = new THREE.BoxGeometry(0.56,0.62,0.32);
    const torsoMat = new THREE.MeshStandardMaterial({ color:uniformColor, roughness:0.7 });
    const torso = new THREE.Mesh(torsoGeo, torsoMat);
    torso.position.y = 1.06;
    torso.castShadow = true;
    group.add(torso);
    parts.torso = torso;

    const armGeo = new THREE.BoxGeometry(0.16,0.6,0.18);
    const armMat = new THREE.MeshStandardMaterial({ color:uniformColor, roughness:0.7 });
    const armL = new THREE.Mesh(armGeo, armMat);
    armL.position.set(-0.38, 1.05, 0);
    armL.castShadow = true;
    const armR = armL.clone();
    armR.position.x = 0.38;
    group.add(armL, armR);
    parts.armR = armR;

    const headGeo = new THREE.SphereGeometry(0.22, 14, 14);
    const headMat = new THREE.MeshStandardMaterial({ color:skinColor, roughness:0.75 });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 1.62;
    head.castShadow = true;
    group.add(head);
    parts.head = head;

    const vestGeo = new THREE.BoxGeometry(0.62,0.4,0.38);
    const vestMat = new THREE.MeshStandardMaterial({ color:0x3a5f3a, roughness:0.6 });
    const vest = new THREE.Mesh(vestGeo, vestMat);
    vest.position.y = 1.18;
    vest.castShadow = true;
    vest.visible = false;
    group.add(vest);
    parts.vest = vest;

    const helmetGeo = new THREE.SphereGeometry(0.26, 14, 14, 0, Math.PI*2, 0, Math.PI*0.62);
    const helmetMat = new THREE.MeshStandardMaterial({ color:0x333333, roughness:0.5 });
    const helmet = new THREE.Mesh(helmetGeo, helmetMat);
    helmet.position.y = 1.7;
    helmet.castShadow = true;

  function applyPlayerLoadout(){
    const inv = loadInventory();
    const equipped = inv.equipped || {};
    const wType = playerState.weaponId;
    const skinId = equipped[wType] || (SKINS[wType] && SKINS[wType][0]?.id);
    const skin = SKINS[wType]?.find(s => s.id === skinId);
    const color = skin ? skin.color : 0x2b2b2b;
    if (playerParts) {
      playerParts.gun.material.color.setHex(color);
    }

    const v = VESTS[playerState.vestId];
    const h = HELMETS[playerState.helmetId];
    if(v.color){ playerParts.vest.visible=true; playerParts.vest.material.color.setHex(v.color); }
    else { playerParts.vest.visible=false; }
    if(h.color){ playerParts.helmet.visible=true; playerParts.helmet.material.color.setHex(h.color); }
    else { playerParts.helmet.visible=false; }
  }

    playerState = {
      hp:100, maxHp:100,
      weaponId:'pistol', vestId:'light', helmetId:'none',
      owned:{ weapons:['pistol'], vests:['none','light'], helmets:['none'] },

  // ============ BOTS ============
  function createBot(){
    const built = createHumanoid(0xc98a6b, 0xa32b2b, false);
    const group = built.group;
    scene.add(group);

    const spot = randomFreeSpot();
    group.position.set(spot.x, 0, spot.z);

      helmetId = helmetChoices[Math.floor(Math.random()*helmetChoices.length)];
      built.parts.helmet.visible = true;
      built.parts.helmet.material.color.setHex(HELMETS[helmetId].color);

    return {
      mesh: group,
      parts: built.parts,

      state:'patrol',
      target: randomFreeSpot(),
      shootTimer: Math.random()*BOT_SHOOT_INTERVAL,
      respawnTimer:0,
      vestId, helmetId
    };

  function randomFreeSpot(){
    for(let i=0;i<20;i++){
      const x = (Math.random()*2-1)*(MAP_HALF-2);
      const z = (Math.random()*2-1)*(MAP_HALF-2);
      const p = new THREE.Vector3(x,0,z);
      let free = true;
      for(const o of obstacles){
        const box = o.box3;
        if(x > box.min.x-1 && x < box.max.x+1 && z > box.min.z-1 && z < box.max.z+1){ free=false; break; }
      }
      if(free) return p;
    }
    return new THREE.Vector3(0,0,0);
  }

  function spawnBots(){
    bots.length = 0;
    for(let i=0;i<5;i++) bots.push(createBot());
  }

  // ============ COLLISION ============
  function resolveCollisions(pos, radius){
    for(const o of obstacles){
      const box = o.box3;
      const closestX = Math.max(box.min.x, Math.min(pos.x, box.max.x));
      const closestZ = Math.max(box.min.z, Math.min(pos.z, box.max.z));
      const dx = pos.x - closestX;
      const dz = pos.z - closestZ;
      const distSq = dx*dx + dz*dz;
      if(distSq < radius*radius){
        const dist = Math.sqrt(distSq) || 0.0001;
        const overlap = radius - dist;
        pos.x += (dx/dist) * overlap;
        pos.z += (dz/dist) * overlap;
      }
    }
    pos.x = Math.max(-MAP_HALF+0.5, Math.min(MAP_HALF-0.5, pos.x));
    pos.z = Math.max(-MAP_HALF+0.5, Math.min(MAP_HALF-0.5, pos.z));
  }

  // ============ INPUT ============
  function onMouseMove(e){
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  }

  function onMouseDown(e){
    if(!gameRunning || shopOpen || paused) return;
    if(e.button === 0) tryShoot();
  }

  function updateAim(){
    raycaster.setFromCamera(mouse, camera);
    const hit = new THREE.Vector3();
    raycaster.ray.intersectPlane(groundPlaneForRay, hit);
    if(hit){
      mouseGroundPoint.copy(hit);
    }
  }

  // ============ SHOOTING ============
  function tryShoot(){
    if(!playerState.alive || playerState.reloading) return;
    if(playerState.fireTimer > 0) return;
    if(playerState.ammo <= 0){ tryReload(); return; }

    const weapon = WEAPONS[playerState.weaponId];
    playerState.ammo--;
    playerState.fireTimer = weapon.cooldown;
    updateHud();

    const dir = playerState.aimDir.clone().normalize();
    spawnBullet(player.position.clone().add(new THREE.Vector3(0,1.0,0)).add(dir.clone().multiplyScalar(0.7)), dir, true, weapon.damage);
  }

  function tryReload(){
    if(!gameRunning || shopOpen || paused || !playerState || !playerState.alive) return;
    if(playerState.reloading || playerState.ammo === playerState.maxAmmo) return;
    playerState.reloading = true;
    playerState.reloadTimer = WEAPONS[playerState.weaponId].reload;
    document.getElementById('reloadMsg').style.display = 'block';
  }

  function spawnBullet(origin, dir, fromPlayer, damage){
    const geo = new THREE.SphereGeometry(fromPlayer?0.09:0.11, 8, 8);
    const mat = new THREE.MeshBasicMaterial({ color: fromPlayer?0xffe27a:0xff5533 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(origin);
    scene.add(mesh);

    const lineMat = new THREE.LineBasicMaterial({ color: fromPlayer?0xffcf6b:0xff7755, transparent:true, opacity:0.6 });
    const lineGeo = new THREE.BufferGeometry().setFromPoints([origin.clone(), origin.clone()]);
    const line = new THREE.Line(lineGeo, lineMat);
    scene.add(line);

    const list = fromPlayer ? bullets : botBullets;
    list.push({ mesh, line, dir: dir.clone(), origin: origin.clone(), speed: fromPlayer?BULLET_SPEED:BOT_BULLET_SPEED, life:2.2, damage: damage||30 });
  }

  function updateBullets(dt){
    updateBulletList(bullets, dt, true);
    updateBulletList(botBullets, dt, false);
  }

  function updateBulletList(list, dt, fromPlayer){
    for(let i=list.length-1;i>=0;i--){
      const b = list[i];
      b.life -= dt;
      const moveVec = b.dir.clone().multiplyScalar(b.speed*dt);
      b.mesh.position.add(moveVec);

      const pts = [b.mesh.position.clone().sub(b.dir.clone().multiplyScalar(0.9)), b.mesh.position.clone()];
      b.line.geometry.setFromPoints(pts);

      let removed = false;

      if(Math.abs(b.mesh.position.x) > MAP_HALF+1 || Math.abs(b.mesh.position.z) > MAP_HALF+1 || b.life<=0){
        removed = true;
      }

      if(!removed){
        for(const o of obstacles){
          const box = o.box3;
          if(b.mesh.position.x > box.min.x && b.mesh.position.x < box.max.x &&
             b.mesh.position.z > box.min.z && b.mesh.position.z < box.max.z &&
             b.mesh.position.y > box.min.y && b.mesh.position.y < box.max.y){
            removed = true; break;
          }
        }
      }

      if(!removed){
        if(fromPlayer){
          for(const bot of bots){
            if(!bot.alive) continue;
            const dist = b.mesh.position.distanceTo(new THREE.Vector3(bot.mesh.position.x, 1.0, bot.mesh.position.z));
            if(dist < 0.65){
              damageBot(bot, b.damage);
              removed = true; break;
            }
          }
        } else {
          if(playerState.alive){
            const dist = b.mesh.position.distanceTo(new THREE.Vector3(player.position.x, 1.0, player.position.z));
            if(dist < 0.65){
              damagePlayer(b.damage);
              removed = true;
            }
          }
        }
      }

      if(removed){
        scene.remove(b.mesh);
        scene.remove(b.line);
        list.splice(i,1);
      }
    }
  }

  function damageBot(bot, amount){
    bot.hp -= amount;
    if(bot.hp <= 0 && bot.alive){
      bot.alive = false;
      bot.mesh.visible = false;
      playerState.kills++;
      playerState.money += KILL_REWARD;
      updateHud();
      bot.respawnTimer = 3.5;
    }
  }

  function damagePlayer(amount){
    if(!playerState.alive) return;
    const vestRed = VESTS[playerState.vestId].reduction;
    const helmetRed = HELMETS[playerState.helmetId].reduction;
    const totalReduction = 1 - (1-vestRed)*(1-helmetRed);
    const finalDamage = amount * (1 - totalReduction);

    playerState.hp -= finalDamage;
    if(playerState.hp <= 0){
      playerState.hp = 0;
      playerState.alive = false;
      onPlayerDeath();
    }
    updateHud();
  }

  // ============ BOT AI ============
  function updateBots(dt){
    for(const bot of bots){
      if(!bot.alive){
        bot.respawnTimer -= dt;
        if(bot.respawnTimer <= 0){
          bot.alive = true;
          bot.hp = bot.maxHp;
          bot.mesh.visible = true;
          const spot = randomFreeSpot();
          bot.mesh.position.set(spot.x,0,spot.z);
          bot.state = 'patrol';
          bot.target = randomFreeSpot();
          const vestChoices = ['light','heavy'];
          const vestId = vestChoices[Math.floor(Math.random()*vestChoices.length)];
          bot.parts.vest.visible = true;
          bot.parts.vest.material.color.setHex(VESTS[vestId].color);
          bot.vestId = vestId;
          bot.parts.helmet.visible = false;
          bot.helmetId = null;
          if(Math.random() < 0.5){
            const helmetChoices = ['light','combat'];
            const helmetId = helmetChoices[Math.floor(Math.random()*helmetChoices.length)];
            bot.parts.helmet.visible = true;
            bot.parts.helmet.material.color.setHex(HELMETS[helmetId].color);
            bot.helmetId = helmetId;
          }
        }
        continue;
      }

      const distToPlayer = playerState.alive ? bot.mesh.position.distanceTo(new THREE.Vector3(player.position.x,0,player.position.z)) : Infinity;

      if(distToPlayer < BOT_DETECT_RADIUS && playerState.alive){
        bot.state = 'attack';
      } else if(distToPlayer > BOT_DETECT_RADIUS * 1.3){
        bot.state = 'patrol';
      }

      if(bot.state === 'patrol'){
        const toTarget = bot.target.clone().sub(bot.mesh.position);
        toTarget.y = 0;
        if(toTarget.length() < 0.5){
          bot.target = randomFreeSpot();
        } else {
          toTarget.normalize();
          const newPos = bot.mesh.position.clone().add(toTarget.multiplyScalar(BOT_SPEED*0.5*dt));
          resolveCollisions(newPos, 0.45);
          bot.mesh.position.copy(newPos);
          bot.mesh.rotation.y = Math.atan2(toTarget.x, toTarget.z);
        }
      } else if(bot.state === 'attack'){
        const toPlayer = new THREE.Vector3(player.position.x - bot.mesh.position.x, 0, player.position.z - bot.mesh.position.z);
        const dist = toPlayer.length();
        toPlayer.normalize();
        bot.mesh.rotation.y = Math.atan2(toPlayer.x, toPlayer.z);

        if(dist > 5){
          const newPos = bot.mesh.position.clone().add(toPlayer.clone().multiplyScalar(BOT_SPEED*dt));
          resolveCollisions(newPos, 0.45);
          bot.mesh.position.copy(newPos);
        }

        bot.shootTimer -= dt;
        if(bot.shootTimer <= 0){
          bot.shootTimer = BOT_SHOOT_INTERVAL + (Math.random()*0.4-0.2);
          const origin = bot.mesh.position.clone().add(new THREE.Vector3(0,1.0,0)).add(toPlayer.clone().multiplyScalar(0.6));
          spawnBullet(origin, toPlayer, false, 10);
        }
      }
    }
  }

  // ============ PLAYER UPDATE ============
  function updatePlayer(dt){
    if(!playerState.alive) return;

    const move = new THREE.Vector3(0,0,0);
    if(keys['KeyW']) move.z -= 1;
    if(keys['KeyS']) move.z += 1;
    if(keys['KeyA']) move.x -= 1;
    if(keys['KeyD']) move.x += 1;
    if(move.lengthSq() > 0){
      move.normalize().multiplyScalar(PLAYER_SPEED*dt);
      const newPos = player.position.clone().add(move);
      resolveCollisions(newPos, 0.45);
      player.position.copy(newPos);
    }

    const dir = new THREE.Vector3(mouseGroundPoint.x - player.position.x, 0, mouseGroundPoint.z - player.position.z);
    if(dir.lengthSq() > 0.0001){
      dir.normalize();
      playerState.aimDir.copy(dir);
      player.rotation.y = Math.atan2(dir.x, dir.z);
    }

    if(playerState.fireTimer > 0) playerState.fireTimer -= dt;
    if(playerState.reloading){
      playerState.reloadTimer -= dt;
      if(playerState.reloadTimer <= 0){
        playerState.reloading = false;
        playerState.ammo = playerState.maxAmmo;
        document.getElementById('reloadMsg').style.display = 'none';
        updateHud();
      }
    }
  }

  // ============ CAMERA ============
  const camOffset = new THREE.Vector3(0, 17, 13);
  function updateCamera(){
    const targetPos = player.position.clone().add(camOffset);
    camera.position.lerp(targetPos, 0.15);
    const lookAt = player.position.clone().add(new THREE.Vector3(0,1,0));
    camera.lookAt(lookAt);
  }

  // ============ HUD ============
  function updateHud(){
    document.getElementById('hpVal').textContent = Math.ceil(playerState.hp);
    document.getElementById('hpFill').style.width = (playerState.hp/playerState.maxHp*100)+'%';
    document.getElementById('ammoVal').textContent = playerState.ammo;
    document.getElementById('killsVal').textContent = playerState.kills;
    document.getElementById('moneyVal').textContent = playerState.money;
  }

  function onPlayerDeath(){
    gameRunning = false;
    paused = false;
    // заработанные деньги = убийства * 100
    const earned = playerState.kills * KILL_REWARD;
    addGlobalBalance(earned);
    document.getElementById('finalKills').textContent = playerState.kills;
    document.getElementById('finalMoney').textContent = earned;
    document.getElementById('gameOver').style.display = 'flex';
    document.getElementById('hud').style.display = 'none';
    document.getElementById('crosshair').style.display = 'none';
    document.getElementById('reloadMsg').style.display = 'none';
    document.getElementById('pauseBtn').style.display = 'none';
    document.getElementById('pauseOverlay').style.display = 'none';
    updateBalanceDisplay();
  }

  // ============ PAUSE ============
  function togglePause(){
    if(!gameRunning || shopOpen) return;
    if(paused) closePause(); else openPause();
  }

  function openPause(){
    if(!gameRunning || !playerState.alive || shopOpen) return;
    paused = true;
    document.getElementById('pauseOverlay').style.display = 'flex';
  }

  function closePause(){
    paused = false;
    document.getElementById('pauseOverlay').style.display = 'none';
  }

  // ============ IN-GAME SHOP ============
  function toggleShop(){
    if(!gameRunning || paused) return;
    if(shopOpen) closeShop(); else openShop();
  }

  function openShop(){
    if(!gameRunning || !playerState.alive || paused) return;
    shopOpen = true;
    renderInGameShop();
    document.getElementById('shopOverlay').style.display = 'flex';
  }

  function closeShop(){
    shopOpen = false;
    document.getElementById('shopOverlay').style.display = 'none';
  }

  function renderInGameShop(){
    const container = document.getElementById('shopContainer');
    container.innerHTML = '';
    document.getElementById('shopMoney').textContent = 'Баланс: $' + playerState.money;
    // Оружие
    Object.values(WEAPONS).forEach(w => {
      const div = document.createElement('div');
      div.className = 'shop-item';
      const owned = playerState.owned.weapons.includes(w.id);
      div.innerHTML = `
        <div class="iname">${w.name}</div>
        <div class="iprice">$${w.price}</div>
        <button data-type="weapon" data-id="${w.id}" ${owned ? 'disabled' : ''}>${owned ? 'В инвентаре' : 'Купить'}</button>
      `;
      const btn = div.querySelector('button');
      if (!owned) {
        btn.addEventListener('click', () => {
          if (playerState.money < w.price) return;
          playerState.money -= w.price;
          playerState.owned.weapons.push(w.id);
          playerState.weaponId = w.id;
          playerState.maxAmmo = w.ammo;
          playerState.ammo = w.ammo;
          playerState.reloading = false;
          playerState.reloadTimer = 0;
          document.getElementById('reloadMsg').style.display = 'none';
          applyPlayerLoadout();
          updateHud();
          renderInGameShop();
        });
      }
      container.appendChild(div);
    });
    // Бронежилеты
    Object.values(VESTS).forEach(v => {
      const div = document.createElement('div');
      div.className = 'shop-item';
      const owned = playerState.owned.vests.includes(v.id);
      div.innerHTML = `
        <div class="iname">${v.name}</div>
        <div class="iprice">$${v.price}</div>
        <button data-type="vest" data-id="${v.id}" ${owned ? 'disabled' : ''}>${owned ? 'В инвентаре' : 'Купить'}</button>
      `;
      const btn = div.querySelector('button');
      if (!owned) {
        btn.addEventListener('click', () => {
          if (playerState.money < v.price) return;
          playerState.money -= v.price;
          playerState.owned.vests.push(v.id);
          playerState.vestId = v.id;
          applyPlayerLoadout();
          updateHud();
          renderInGameShop();
        });
      }
      container.appendChild(div);
    });
    // Шлемы
    Object.values(HELMETS).forEach(h => {
      const div = document.createElement('div');
      div.className = 'shop-item';
      const owned = playerState.owned.helmets.includes(h.id);
      div.innerHTML = `
        <div class="iname">${h.name}</div>
        <div class="iprice">$${h.price}</div>
        <button data-type="helmet" data-id="${h.id}" ${owned ? 'disabled' : ''}>${owned ? 'В инвентаре' : 'Купить'}</button>
      `;
      const btn = div.querySelector('button');
      if (!owned) {
        btn.addEventListener('click', () => {
          if (playerState.money < h.price) return;
          playerState.money -= h.price;
          playerState.owned.helmets.push(h.id);
          playerState.helmetId = h.id;
          applyPlayerLoadout();
          updateHud();
          renderInGameShop();
        });
      }
      container.appendChild(div);
    });
  }

  // ============ BUY PHASE ============
  let buyTimerInterval = null;
  function startBuyPhase(callback) {
    buyPhaseActive = true;
    let timeLeft = BUY_PHASE_DURATION;
    document.getElementById('buyTimerDisplay').textContent = timeLeft;
    document.getElementById('buyTimerOverlay').style.display = 'block';
    // Открыть магазин
    openShop();
    buyTimerInterval = setInterval(() => {
      timeLeft--;
      document.getElementById('buyTimerDisplay').textContent = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(buyTimerInterval);
        buyTimerInterval = null;
        buyPhaseActive = false;
        document.getElementById('buyTimerOverlay').style.display = 'none';
        closeShop();
        callback();
      }
    }, 1000);
  }

  // ============ MAIN LOOP ============
  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.1);

    if(gameRunning && !shopOpen && !paused && !buyPhaseActive){
      updateAim();
      updatePlayer(dt);
      updateBots(dt);
      updateBullets(dt);
      updateCamera();
    }

    renderer.render(scene, camera);
  }

  // ============ GAME LIFECYCLE ============
  function startGame(){
    clearDynamicObjects();

    resetPlayerState();
    player = createPlayer();
    applyPlayerLoadout();
    spawnBots();

    document.getElementById('nickBox').textContent = playerNick;
    document.getElementById('menu').style.display = 'none';
    document.getElementById('gameOver').style.display = 'none';
    document.getElementById('shopOverlay').style.display = 'none';
    document.getElementById('hud').style.display = 'flex';
    document.getElementById('crosshair').style.display = 'block';
    document.getElementById('pauseBtn').style.display = 'flex';
    document.getElementById('pauseOverlay').style.display = 'none';
    updateHud();

    shopOpen = false;
    paused = false;
    gameRunning = false; // будет включено после таймера

    // Запускаем фазу закупки
    startBuyPhase(() => {
      gameRunning = true;
      clock.getDelta();
    });
  }

  function returnToMenu(){
    gameRunning = false;
    shopOpen = false;
    paused = false;
    if (buyTimerInterval) { clearInterval(buyTimerInterval); buyTimerInterval = null; }
    buyPhaseActive = false;
    document.getElementById('buyTimerOverlay').style.display = 'none';
    clearDynamicObjects();
    document.getElementById('gameOver').style.display = 'none';
    document.getElementById('shopOverlay').style.display = 'none';
    document.getElementById('pauseOverlay').style.display = 'none';
    document.getElementById('pauseBtn').style.display = 'none';
    document.getElementById('hud').style.display = 'none';
    document.getElementById('crosshair').style.display = 'none';
    document.getElementById('reloadMsg').style.display = 'none';
    document.getElementById('menu').style.display = 'flex';
    updateBalanceDisplay();
  }

  function clearDynamicObjects(){
    if(player){ scene.remove(player); player = null; playerParts = null; }
    for(const bot of bots){ scene.remove(bot.mesh); }
    bots.length = 0;
    for(const b of bullets){ scene.remove(b.mesh); scene.remove(b.line); }
    bullets.length = 0;
    for(const b of botBullets){ scene.remove(b.mesh); scene.remove(b.line); }
    botBullets.length = 0;
  }

  // ============ UI HOOKS ============
  document.getElementById('startBtn').addEventListener('click', () => {
    const val = document.getElementById('nickInput').value.trim();
    playerNick = val.length ? val : 'Player';
    startGame();
  });

  document.getElementById('restartBtn').addEventListener('click', () => {
    document.getElementById('gameOver').style.display = 'none';
    startGame();
  });

  document.getElementById('menuBtn').addEventListener('click', returnToMenu);

  document.getElementById('nickInput').addEventListener('keydown', e => {
    if(e.code === 'Enter') document.getElementById('startBtn').click();
  });

  // Пауза кнопки
  document.getElementById('pauseBtn').addEventListener('click', togglePause);
  document.getElementById('resumeBtn').addEventListener('click', closePause);
  document.getElementById('pauseShopBtn').addEventListener('click', () => { closePause(); openShop(); });
  document.getElementById('pauseMenuBtn').addEventListener('click', () => { closePause(); returnToMenu(); });

  // Кнопки магазина
  document.getElementById('shopBtn').addEventListener('click', toggleShop);
  document.getElementById('closeShopBtn').addEventListener('click', closeShop);

  // ============ BOOT ============
  clock = new THREE.Clock();
  initScene();
  animate();

  // Отобразить баланс при старте
  updateBalanceDisplay();
  // Инициализация вкладок
  renderSkinShop();
  renderInventory();
  renderCases();

})();
</script>
</body>
</html>
